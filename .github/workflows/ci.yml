name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Download Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.29.0
          GITLEAKS_SHA256: 39e07ad810336fd0ae80d0bd61c60d0521f628173e7583583b5df4a38738522c
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
      - name: Check repository
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="--all" .

  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - run: npm ci
      - run: npm run build
      - run: npm run test:cache
      - run: npm run check:design-system
      - name: Verify npm license report
        if: runner.os == 'Linux'
        run: npm run licenses:npm && git diff --exit-code -- NPM_THIRD_PARTY_LICENSES.html
      - name: Test Linux bundle preparation
        if: runner.os == 'Linux'
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo fmt --manifest-path core/Cargo.toml --check
      - run: cargo test --manifest-path core/Cargo.toml --locked
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Verify Rust license report
        if: runner.os == 'Linux'
        run: |
          cargo install --locked --features cli --version 0.9.1 cargo-about
          npm run licenses:rust
          git diff --exit-code -- RUST_THIRD_PARTY_LICENSES.html
      - name: Build Windows application with embedded frontend
        if: runner.os == 'Windows'
        run: npm run tauri -- build --debug --no-bundle

name: Сообщить об ошибке
description: Что-то не работает в VLauncher
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Не прикладывайте токены и личные данные. Уязвимости отправляйте по SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Версия VLauncher
      placeholder: Например, 1.0.4
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Операционная система
      placeholder: Например, Windows 11 24H2 или Fedora 42
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: Что нужно сделать, чтобы увидеть ошибку?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Дополнительные сведения
      description: Можно приложить скриншот или небольшой фрагмент лога без токенов.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Проверка перед отправкой
      options:
        - label: Я поискал похожие issues и убрал токены и личные данные.
          required: true

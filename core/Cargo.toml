[package]
name = "vlauncher-core"
version = "1.0.4"
edition = "2024"
description = "Package and profile code used by VLauncher"
publish = false
license = "GPL-3.0-only"
repository = "https://github.com/boolean-false/VLauncher"
homepage = "https://vlauncher.space"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
hex = "0.4"
fs2 = "0.4"
semver = { version = "1", features = ["serde"] }
rusqlite = { version = "0.38", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
walkdir = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

tempfile = "3"
